# Stratum Dashboard
#
# Pulls the published image from GitHub Container Registry. The package is
# private, so authenticate on the host once before starting:
#
#   docker login ghcr.io -u someone6783 --password-stdin   # password: a PAT with read:packages
#
# Pin to a release tag such as `ebc76de` or a semver tag instead of `latest`
# to keep a deployment pinned to a known build.
services:
  stratum:
    image: ghcr.io/someone6783/stratum-dashboard:latest
    pull_policy: always
    ports:
      - "8787:8787"
    environment:
      DATA_DIR: /data
      EMBED_ORIGINS: ${EMBED_ORIGINS:-https://example.com}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      PROMETHEUS_TOKEN: ${PROMETHEUS_TOKEN:-}
      PROMETHEUS_CACHE_TTL_MS: ${PROMETHEUS_CACHE_TTL_MS:-10000}
    volumes:
      - stratum-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8787/api/health"]
      interval: 20s
      timeout: 3s
      retries: 3

volumes:
  stratum-data: